name: Upstream Sync Review

# Run manually when we want to check for upstream changes.
# This NEVER auto-merges — it creates a draft PR for human review.
on:
  workflow_dispatch:

jobs:
  sync-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch GitLab upstream
        run: |
          git remote add gitlab https://gitlab.com/veloren/veloren.git
          git fetch gitlab master --no-tags

      - name: Check for new upstream commits
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse gitlab/master)
          BASE_SHA=$(git rev-parse origin/development)
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "upstream_short=${UPSTREAM_SHA:0:8}" >> $GITHUB_OUTPUT

          if git merge-base --is-ancestor "$UPSTREAM_SHA" "$BASE_SHA"; then
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
            echo "No new upstream commits — development already contains upstream."
          else
            COUNT=$(git rev-list "$BASE_SHA..gitlab/master" --count)
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
            echo "Found $COUNT new upstream commits to review."
          fi

      - name: Create review branch
        if: steps.check.outputs.has_new_commits == 'true'
        id: branch
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="upstream/review-${DATE}-${{ steps.check.outputs.upstream_short }}"
          git checkout -b "$BRANCH" gitlab/master
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create draft PR for review
        if: steps.check.outputs.has_new_commits == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            ## Upstream changes to review

            This is an automated **draft PR** for manual review of new commits from the Veloren GitLab upstream.

            **DO NOT merge this raw-review PR.** It exists only to inspect the upstream delta.
            Use the `gitlab-master-merger` skill to create a separate integration branch from
            `development`, resolve conflicts, validate it, and open the mergeable PR.

            A human must:

            1. Review the diff
            2. Identify which upstream changes are safe to integrate (bug fixes, asset updates, non-conflicting features)
            3. Identify which upstream changes conflict with our custom modifications (magic/attunement, combat, classes/races, progression)
            4. For each conflict: adapt the upstream change to work alongside our code, or discard it if it reverts our work
            5. Only merge after conflicts are resolved and changes are validated

            ## Our priority areas (never let upstream overwrite these)

            - `common/src/comp/attunement.rs`, `server/src/sys/attunement.rs` — attunement (ENG-D2)
            - `common/src/combat.rs`, `common/src/comp/ability.rs` — combat formulas + abilities/magic
            - `common/src/comp/inventory/` — items (RequiresAttunement, has_tag, etc.)
            - skillset / character-levels / classes-races, `server/src/persistence/*` — progression (⚠️ DB)
            - `.lfsconfig`, `.gitattributes`, `.github/workflows/*` — CI/LFS (never re-introduce GitHub LFS)
            - `docs/design/` — our internal docs
            # NOTE: the old smooth-terrain/Transvoxel pipeline was discarded — see docs/design/DEFERRED-TO-V2.md

            ## How to resolve conflicts

            ```bash
            # 1. Pull the review branch locally
            git fetch origin
            git checkout upstream/review-YYYY-MM-DD

            # 2. Create a working integration branch
            git checkout -b upstream/integrate-YYYY-MM-DD origin/development

            # 3. Merge and resolve conflicts manually, keeping our changes
            git merge gitlab/master

            # 4. Validate, push the integration branch, and open a separate
            #    draft PR with base development
            ```
        run: |
          UPSTREAM_SHORT="${{ steps.check.outputs.upstream_short }}"
          DATE=$(date +%Y-%m-%d)
          BRANCH="${{ steps.branch.outputs.branch }}"

          gh pr create \
            --base development \
            --head "$BRANCH" \
            --draft \
            --title "⚠️ [Upstream Review] veloren/veloren@${UPSTREAM_SHORT} — ${DATE}" \
            --body "$PR_BODY"

      - name: Report no new commits
        if: steps.check.outputs.has_new_commits == 'false'
        run: echo "✅ No new upstream commits. development is already up to date with GitLab master."
