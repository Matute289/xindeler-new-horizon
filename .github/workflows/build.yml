name: Build & publish client

# NH-58: builds every xindeler-voxygen client target and publishes the
# packages to the downloads server. Runs ONLY on a `v*` tag (a real release),
# never on a plain merge to development — that cheaper "does it still link"
# check lives in build-check.yml instead, so this workflow (which pulls the
# 467 MB asset tree and does real packaging/signing) doesn't run on every PR.
#
# Phased rollout (docs/design/plans/2026-07-27-nh58-cross-platform-client-builds-plan.md):
#   Phase 0 — Linux x64 (done)
#   Phase 1 — macOS ARM (done)
#   Phase 2 — macOS Intel slice (done); signing/notarization wired but
#             conditional on Apple secrets existing (N58-C3-C6) — ships
#             unsigned until Matías sets them, no workflow change needed
#             when he does.
#   Phase 3 — Windows x64 (done); signing wired but conditional on
#             WINDOWS_CERT_PFX_BASE64 existing, same pattern as macOS —
#             ships unsigned until Matías sets it.
#   Phase 4 — Linux ARM64 (done), native on ubuntu-24.04-arm.
#   Phase 5 — Windows ARM64, highest risk (wasmtime is Tier 3 there),
#             not started.
#   Phase 6 — this file's `assets` + `publish` jobs.
#
# Downloads contract: docs/design/specs/2026-09-06-client-downloads-contract.md
# (xindeler-web-api reads manifest.json/latest.json to resolve download URLs
# for xindeler-web-landing — coordinated with that repo's session directly).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate this is a real version tag
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to build/publish from anything but a v* tag
        # workflow_dispatch can be run against any branch, not just a tag —
        # without this check, doing that would set VERSION to the branch
        # name (e.g. "development") and the publish job would happily
        # rsync a bogus release under that name to the real downloads
        # server. Fail fast here before spending any build minutes.
        run: |
          if [[ "${{ github.ref_type }}" != "tag" || ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::build.yml must run against a v* tag (got ref_type=${{ github.ref_type }}, VERSION=$VERSION). Refusing to build/publish from a branch."
            exit 1
          fi
          echo "OK: publishing $VERSION"

  assets:
    name: Package shared assets
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup SSH (self-hosted VPS LFS store)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan greenmountain.dev >> ~/.ssh/known_hosts

      - name: Pull LFS assets (from VPS)
        run: |
          git lfs install --local
          git lfs pull

      - name: Package assets.tar.gz
        # Q7=A (worksheet): one shared assets archive, not bundled per
        # platform — 467 MB once, not ×6.
        run: tar czf assets.tar.gz -C assets .

      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets.tar.gz
          retention-days: 7

  linux-x86_64:
    name: Linux x64
    needs: [validate, assets]
    runs-on: ubuntu-latest
    env:
      VELOREN_USERDATA_STRATEGY: executable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            mold binutils pkg-config libasound2-dev libudev-dev cmake ninja-build zip

      - name: Authorize access to the private auth dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_REPO_SSH_KEY }}

      - name: Install Rust toolchain (pinned, read from rust-toolchain)
        run: |
          TOOLCHAIN="$(cat rust-toolchain)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release-linux-x86_64

      - name: Build xindeler-voxygen (release, default-publish)
        run: cargo build --release --no-default-features --features default-publish -p xindeler-voxygen

      - name: Smoke test — the binary actually links and starts
        run: ./target/release/xindeler-voxygen --help

      # NH-60: the package below now bundles assets/ next to the binary —
      # previously it shipped the binary alone, which crashed on launch for
      # anyone who downloaded it manually (the shared assets.tar.gz was a
      # separate download nothing combined). Pulling the already-built
      # artifact from the assets job below is cheap; it avoids a second LFS
      # pull on this runner. See
      # ../../docs/design/specs/2026-09-09-updater-sync-protocol-contract.md.
      - name: Download shared assets (from the assets job, not a fresh LFS pull)
        uses: actions/download-artifact@v4
        with:
          name: assets

      - name: Compress debug sections and package (binary + assets/)
        run: |
          objcopy --compress-debug-sections=zlib \
            target/release/xindeler-voxygen target/release/xindeler-voxygen-compressed
          mv target/release/xindeler-voxygen-compressed target/release/xindeler-voxygen
          mkdir -p pkg/assets
          cp target/release/xindeler-voxygen pkg/
          tar xzf assets.tar.gz -C pkg/assets
          tar czf xindeler-voxygen-linux-x86_64.tar.gz -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x86_64
          path: xindeler-voxygen-linux-x86_64.tar.gz
          retention-days: 7

      # NH-60: xindeler-updater's remozipsy dependency reads the ZIP central
      # directory format specifically — it does NOT work against a .tar.gz.
      # This extra .zip (same pkg/ contents, just re-archived) is ONLY for
      # the updater/ tree the publish job builds below; the .tar.gz above is
      # untouched and keeps serving manual downloads. See
      # ../../docs/design/specs/2026-09-09-updater-sync-protocol-contract.md.
      - name: Package a .zip of the same content, for xindeler-updater only
        run: (cd pkg && zip -r ../xindeler-voxygen-linux-x86_64-updater.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x86_64-updater-zip
          path: xindeler-voxygen-linux-x86_64-updater.zip
          retention-days: 7

  linux-aarch64:
    name: Linux ARM64
    needs: [validate, assets]
    runs-on: ubuntu-24.04-arm
    env:
      VELOREN_USERDATA_STRATEGY: executable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            mold binutils pkg-config libasound2-dev libudev-dev cmake ninja-build zip

      - name: Authorize access to the private auth dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_REPO_SSH_KEY }}

      - name: Install Rust toolchain (pinned, read from rust-toolchain)
        run: |
          TOOLCHAIN="$(cat rust-toolchain)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release-linux-aarch64

      - name: Build xindeler-voxygen (release, default-publish)
        # Native on this ARM runner (NH-58 [Q3]=A) — see .cargo/config.toml
        # for why no cross linker is configured for this target anymore.
        run: cargo build --release --no-default-features --features default-publish -p xindeler-voxygen

      - name: Smoke test — the binary actually links and starts
        run: ./target/release/xindeler-voxygen --help

      # NH-60: see the matching step in the linux-x86_64 job for why this exists.
      - name: Download shared assets (from the assets job, not a fresh LFS pull)
        uses: actions/download-artifact@v4
        with:
          name: assets

      - name: Compress debug sections and package (binary + assets/)
        run: |
          objcopy --compress-debug-sections=zlib \
            target/release/xindeler-voxygen target/release/xindeler-voxygen-compressed
          mv target/release/xindeler-voxygen-compressed target/release/xindeler-voxygen
          mkdir -p pkg/assets
          cp target/release/xindeler-voxygen pkg/
          tar xzf assets.tar.gz -C pkg/assets
          tar czf xindeler-voxygen-linux-aarch64.tar.gz -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-aarch64
          path: xindeler-voxygen-linux-aarch64.tar.gz
          retention-days: 7

      # NH-60: see the matching step in the linux-x86_64 job for why this exists.
      - name: Package a .zip of the same content, for xindeler-updater only
        run: (cd pkg && zip -r ../xindeler-voxygen-linux-aarch64-updater.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-aarch64-updater-zip
          path: xindeler-voxygen-linux-aarch64-updater.zip
          retention-days: 7

  macos-arm64:
    name: macOS ARM (Apple Silicon)
    needs: [validate, assets]
    runs-on: macos-latest
    env:
      VELOREN_USERDATA_STRATEGY: executable
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      RUSTFLAGS: "-D warnings"
      CARGO_INCREMENTAL: "0"
      # `secrets` isn't a permitted context in a step's `if:` — has to be
      # routed through `env` first (actionlint caught this; without it the
      # whole workflow file fails to parse on every push, not just a bad
      # step). https://docs.github.com/en/actions/learn-github-actions/contexts#context-availability
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Authorize access to the private auth dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_REPO_SSH_KEY }}

      - name: Install Rust toolchain (pinned, read from rust-toolchain)
        run: |
          TOOLCHAIN="$(cat rust-toolchain)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release-macos-arm64

      - name: Build xindeler-voxygen (release-thinlto, default-publish)
        run: cargo build --profile release-thinlto --no-default-features --features default-publish -p xindeler-voxygen

      - name: Smoke test — the binary actually links and starts
        run: ./target/release-thinlto/xindeler-voxygen --help

      - name: Free up disk space before packaging
        # v0.25.0's first real run: hdiutil failed with "No space left on
        # device" building the .dmg. GitHub's macOS runners don't have
        # enough free space left after a release-thinlto build (LTO +
        # shaderc + wgpu + every game dependency) to also hold the .app/.dmg
        # output. The binary is all packaging needs — copy it out, then
        # drop the ~15+ GB target/ directory before touching hdiutil.
        run: |
          mkdir -p /tmp/xindeler-out
          cp target/release-thinlto/xindeler-voxygen /tmp/xindeler-out/xindeler-voxygen
          rm -rf target
          df -h /

      # NH-60: assets/ now ships inside the .app — a manual macOS download
      # previously had the same "Asset directory not found" crash as
      # Windows/Linux. Extracted after the disk-space cleanup above so this
      # doesn't reintroduce the "No space left on device" issue that step
      # exists to avoid. See
      # ../../docs/design/specs/2026-09-09-updater-sync-protocol-contract.md.
      - name: Download shared assets (from the assets job, not a fresh LFS pull)
        uses: actions/download-artifact@v4
        with:
          name: assets

      - name: Extract shared assets
        run: |
          mkdir -p /tmp/xindeler-assets
          tar xzf assets.tar.gz -C /tmp/xindeler-assets

      - name: Import signing certificate
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          # Word-splitting here is the intent: each keychain path is one word.
          # shellcheck disable=SC2086
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS
          rm -f cert.p12

      - name: Package .app + .dmg
        run: bash .github/scripts/macos-package.sh /tmp/xindeler-out/xindeler-voxygen arm64 "$VERSION" /tmp/xindeler-assets

      - name: Sign
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        # .github/entitlements.plist grants the JIT/unsigned-memory/
        # library-validation allowances wasmtime's Cranelift backend needs —
        # without them the hardened runtime (--options runtime below) kills
        # the process the instant a WASM plugin loads (plan §6.3's silent-
        # failure mode: signs fine, notarizes fine, dies on first plugin).
        # Keep that plist itself comment-free: Apple's entitlements XML
        # parser (AMFIUnserializeXML, not the generic plist parser) chokes
        # on a `--` inside an XML comment, which cost a full debug cycle to
        # find (v0.25.3's release run).
        run: |
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')"
          codesign --force --deep --options runtime --timestamp \
            --entitlements .github/entitlements.plist \
            --sign "$IDENTITY" Xindeler.app
          codesign --verify --strict --deep Xindeler.app

      - name: Re-package signed .app into .dmg
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        # NH-60 grew the .app by ~467MB (bundled assets/), which made
        # hdiutil's no-`-size` auto-estimate fail with "No space left on
        # device" here too -- the exact same failure class already fixed
        # once for the FIRST hdiutil call, in macos-package.sh (see that
        # script's comment). This second call (re-packaging after signing)
        # needs the identical explicit-size treatment.
        run: |
          rm -f xindeler-voxygen-macos-arm64.dmg
          APP_SIZE_MB="$(du -sm Xindeler.app | cut -f1)"
          DMG_SIZE_MB=$((APP_SIZE_MB + APP_SIZE_MB / 2 + 20))
          hdiutil create -volname Xindeler -srcfolder Xindeler.app -ov -format UDZO -size "${DMG_SIZE_MB}m" xindeler-voxygen-macos-arm64.dmg

      - name: Notarize
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true' }}
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > AuthKey.p8
          xcrun notarytool submit xindeler-voxygen-macos-arm64.dmg \
            --key AuthKey.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait
          xcrun stapler staple xindeler-voxygen-macos-arm64.dmg
          rm -f AuthKey.p8

      - name: Rename package if unsigned (no secrets configured yet)
        if: ${{ env.HAS_APPLE_CERT != 'true' }}
        run: mv xindeler-voxygen-macos-arm64.dmg xindeler-voxygen-macos-arm64-unsigned.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-arm64
          path: xindeler-voxygen-macos-arm64*.dmg
          retention-days: 7

      # NH-60: xindeler-updater's remozipsy dependency needs a real .zip (see
      # the linux-x86_64 job's matching comment) AND expects a flat directory
      # (binary + assets/ at the root) — not a .app bundle, since the
      # launcher execs the binary directly the same way it does on
      # Linux/Windows. Built from the raw binary/assets, independent of the
      # .app/.dmg above. See
      # ../../docs/design/specs/2026-09-09-updater-sync-protocol-contract.md.
      - name: Package a flat .zip of the same content, for xindeler-updater only
        run: |
          mkdir -p updater-pkg
          cp /tmp/xindeler-out/xindeler-voxygen updater-pkg/
          cp -r /tmp/xindeler-assets updater-pkg/assets
          (cd updater-pkg && zip -r ../xindeler-voxygen-macos-aarch64-updater.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-aarch64-updater-zip
          path: xindeler-voxygen-macos-aarch64-updater.zip
          retention-days: 7

  macos-x86_64:
    name: macOS Intel (cross-compiled on the ARM runner)
    needs: [validate, assets]
    runs-on: macos-latest
    env:
      VELOREN_USERDATA_STRATEGY: executable
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      RUSTFLAGS: "-D warnings"
      CARGO_INCREMENTAL: "0"
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Authorize access to the private auth dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_REPO_SSH_KEY }}

      - name: Install Rust toolchain (pinned, read from rust-toolchain)
        run: |
          TOOLCHAIN="$(cat rust-toolchain)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"
          rustup target add x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release-macos-x86_64

      - name: Build xindeler-voxygen (release-thinlto, default-publish)
        run: cargo build --target=x86_64-apple-darwin --profile release-thinlto --no-default-features --features default-publish -p xindeler-voxygen

      - name: Install Rosetta 2 (to execute the cross-compiled binary)
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Smoke test — the binary actually links and starts (via Rosetta)
        run: ./target/x86_64-apple-darwin/release-thinlto/xindeler-voxygen --help

      - name: Free up disk space before packaging
        # Same fix as macos-arm64 — see that job's comment for why.
        run: |
          mkdir -p /tmp/xindeler-out
          cp target/x86_64-apple-darwin/release-thinlto/xindeler-voxygen /tmp/xindeler-out/xindeler-voxygen
          rm -rf target
          df -h /

      # NH-60: see the matching step in the macos-arm64 job for why this exists.
      - name: Download shared assets (from the assets job, not a fresh LFS pull)
        uses: actions/download-artifact@v4
        with:
          name: assets

      - name: Extract shared assets
        run: |
          mkdir -p /tmp/xindeler-assets
          tar xzf assets.tar.gz -C /tmp/xindeler-assets

      - name: Import signing certificate
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"')
          # Word-splitting here is the intent: each keychain path is one word.
          # shellcheck disable=SC2086
          security list-keychains -d user -s build.keychain $EXISTING_KEYCHAINS
          rm -f cert.p12

      - name: Package .app + .dmg
        run: bash .github/scripts/macos-package.sh /tmp/xindeler-out/xindeler-voxygen x86_64 "$VERSION" /tmp/xindeler-assets

      - name: Sign
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        # .github/entitlements.plist grants the JIT/unsigned-memory/
        # library-validation allowances wasmtime's Cranelift backend needs —
        # without them the hardened runtime (--options runtime below) kills
        # the process the instant a WASM plugin loads (plan §6.3's silent-
        # failure mode: signs fine, notarizes fine, dies on first plugin).
        # Keep that plist itself comment-free: Apple's entitlements XML
        # parser (AMFIUnserializeXML, not the generic plist parser) chokes
        # on a `--` inside an XML comment, which cost a full debug cycle to
        # find (v0.25.3's release run).
        run: |
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)"/\1/')"
          codesign --force --deep --options runtime --timestamp \
            --entitlements .github/entitlements.plist \
            --sign "$IDENTITY" Xindeler.app
          codesign --verify --strict --deep Xindeler.app

      - name: Re-package signed .app into .dmg
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        # See the identical comment on the macos-arm64 job's own copy of this
        # step for why the explicit -size is needed now.
        run: |
          rm -f xindeler-voxygen-macos-x86_64.dmg
          APP_SIZE_MB="$(du -sm Xindeler.app | cut -f1)"
          DMG_SIZE_MB=$((APP_SIZE_MB + APP_SIZE_MB / 2 + 20))
          hdiutil create -volname Xindeler -srcfolder Xindeler.app -ov -format UDZO -size "${DMG_SIZE_MB}m" xindeler-voxygen-macos-x86_64.dmg

      - name: Notarize
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true' }}
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > AuthKey.p8
          xcrun notarytool submit xindeler-voxygen-macos-x86_64.dmg \
            --key AuthKey.p8 \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait
          xcrun stapler staple xindeler-voxygen-macos-x86_64.dmg
          rm -f AuthKey.p8

      - name: Rename package if unsigned (no secrets configured yet)
        if: ${{ env.HAS_APPLE_CERT != 'true' }}
        run: mv xindeler-voxygen-macos-x86_64.dmg xindeler-voxygen-macos-x86_64-unsigned.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-x86_64
          path: xindeler-voxygen-macos-x86_64*.dmg
          retention-days: 7

      # NH-60: see the matching step in the macos-arm64 job for why this exists.
      - name: Package a flat .zip of the same content, for xindeler-updater only
        run: |
          mkdir -p updater-pkg
          cp /tmp/xindeler-out/xindeler-voxygen updater-pkg/
          cp -r /tmp/xindeler-assets updater-pkg/assets
          (cd updater-pkg && zip -r ../xindeler-voxygen-macos-x86_64-updater.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-x86_64-updater-zip
          path: xindeler-voxygen-macos-x86_64-updater.zip
          retention-days: 7

  windows-x86_64:
    name: Windows x64
    needs: [validate, assets]
    runs-on: windows-latest
    env:
      VELOREN_USERDATA_STRATEGY: executable
      # Same pattern as the macOS HAS_APPLE_* vars: `secrets` isn't a valid
      # context inside a step `if:`, so route through `env` first.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # build.rs (#[cfg(windows)]) embeds assets/voxygen/logo.ico via winres
      # AT BUILD TIME — without this, the checkout only has the LFS pointer
      # text (lfs: false above) and rc.exe fails with a misleading "is not
      # in 3.00 format" (see build-check.yml's windows-x86_64 job, or #265-268,
      # for the saga this cost before finding the actual cause).
      - name: Setup SSH (self-hosted VPS LFS store)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan greenmountain.dev >> ~/.ssh/known_hosts

      - name: Pull the Windows exe icon from LFS (only this one file)
        run: |
          git lfs install --local
          git lfs pull -I "assets/voxygen/logo.ico"

      - name: Install ninja (for shaderc-from-source's cmake build)
        run: choco install ninja -y

      - name: Authorize access to the private auth dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_REPO_SSH_KEY }}

      - name: Install Rust toolchain (pinned, read from rust-toolchain)
        run: |
          TOOLCHAIN="$(cat rust-toolchain)"
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-release-windows-x86_64

      - name: Build xindeler-voxygen (release, default-publish)
        # x86_64-pc-windows-msvc (NH-58 [Q2]=A), native on this runner.
        run: cargo build --release --no-default-features --features default-publish -p xindeler-voxygen

      - name: Smoke test — the binary actually links and starts
        run: ./target/release/xindeler-voxygen.exe --help

      # NH-60: assets/ now ships next to the .exe inside the zip — a manual
      # download previously crashed on launch with "Asset directory not
      # found" (the incident that started this). See
      # ../../docs/design/specs/2026-09-09-updater-sync-protocol-contract.md.
      - name: Download shared assets (from the assets job, not a fresh LFS pull)
        uses: actions/download-artifact@v4
        with:
          name: assets

      - name: Extract shared assets
        run: |
          mkdir -p target/release/assets
          tar xzf assets.tar.gz -C target/release/assets

      - name: Sign (stub — unsigned until Matías sets WINDOWS_CERT_PFX_BASE64)
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          echo "$WINDOWS_CERT_PFX_BASE64" | base64 --decode > cert.pfx
          SIGNTOOL="$(find '/c/Program Files (x86)/Windows Kits/10/bin' -name signtool.exe -path '*x64*' | sort | tail -1)"
          "$SIGNTOOL" sign /f cert.pfx /p "$WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target/release/xindeler-voxygen.exe
          rm -f cert.pfx

      - name: Package .zip
        run: |
          cd target/release
          if [ "$HAS_WINDOWS_CERT" = "true" ]; then
            powershell -Command "Compress-Archive -Path xindeler-voxygen.exe,assets -DestinationPath xindeler-voxygen-windows-x86_64.zip"
          else
            powershell -Command "Compress-Archive -Path xindeler-voxygen.exe,assets -DestinationPath xindeler-voxygen-windows-x86_64-unsigned.zip"
          fi
          mv xindeler-voxygen-windows-x86_64*.zip ../../

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows-x86_64
          path: xindeler-voxygen-windows-x86_64*.zip
          retention-days: 7

  publish:
    name: Publish to downloads server
    needs: [assets, linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64, windows-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist/

      - name: Generate manifest.json
        run: bash .github/scripts/generate-manifest.sh "$VERSION" dist dist/manifest.json

      # NH-60: static tree for xindeler-updater's remozipsy-based sync — see
      # ../../docs/design/specs/2026-09-09-updater-sync-protocol-contract.md.
      # Channel "release" per that spec's recommendation (single channel,
      # matches NH-60 [Q4]'s existing "no nightly channel" decision) —
      # trivial to rename later if Matías picks something else.
      - name: Generate updater/ static tree
        run: bash .github/scripts/generate-updater-tree.sh "$VERSION" release dist dist/updater

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan greenmountain.dev >> ~/.ssh/known_hosts

      - name: Upload release to the VPS downloads root
        # /srv/xindeler/downloads/public is nginx's actual document root for
        # downloads.xindeler.com (verified against
        # MyServerVPS/nginx/sites-available/downloads.xindeler.com — the
        # vhost's `root` directive, not just the /srv/xindeler/downloads
        # parent dir the CDN migration spec mentions in passing).
        run: |
          REMOTE_DIR="/srv/xindeler/downloads/public/releases/$VERSION"
          # $VERSION expanding client-side (a GH Actions env var, not something
          # the remote host has) is the intent.
          # shellcheck disable=SC2029
          ssh mgrinberg@greenmountain.dev "mkdir -p '$REMOTE_DIR'"
          rsync -avz --progress dist/ "mgrinberg@greenmountain.dev:$REMOTE_DIR/"
          scp dist/manifest.json "mgrinberg@greenmountain.dev:/srv/xindeler/downloads/public/latest.json"

      - name: Upload the updater/ tree (always-current, not versioned under releases/)
        # NH-60: separate destination from releases/$VERSION/ above — this one
        # gets overwritten every release, since xindeler-updater always asks
        # for "latest" rather than a specific tag.
        run: |
          ssh mgrinberg@greenmountain.dev "mkdir -p /srv/xindeler/downloads/public/updater"
          rsync -avz --progress --delete dist/updater/ "mgrinberg@greenmountain.dev:/srv/xindeler/downloads/public/updater/"

      - name: Report
        run: |
          echo "Published $VERSION to https://downloads.xindeler.com/releases/$VERSION/"
          echo "Manifest: https://downloads.xindeler.com/latest.json"
          echo "Updater tree: https://downloads.xindeler.com/updater/"
