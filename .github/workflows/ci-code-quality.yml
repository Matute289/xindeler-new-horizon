name: Code Quality (PR)

# BL-70: run the SAME gate as .github/scripts/code-quality.sh
# (cargo clippy ×3 with -D warnings + cargo fmt --all --check) on every PR to
# development/main, so code that doesn't compile / has clippy warnings / isn't
# rustfmt-clean cannot merge. This is what #129/#130 slipped past (GH Actions
# previously ran only the branch-target guards).
#
# CODE CI ONLY — never pulls LFS: binary assets live on the VPS, and
# compile/lint/fmt don't need them (CLAUDE.md rule).

on:
  pull_request:
    branches: [development, main]
  workflow_dispatch:

# One run per PR ref; cancel superseded runs to save minutes.
concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    env:
      # Defensive: clippy doesn't load assets, but code-quality.sh exports nothing.
      VELOREN_ASSETS: ${{ github.workspace }}/assets
    steps:
      - name: Checkout (no LFS — assets are on the VPS, not GitHub)
        uses: actions/checkout@v4
        with:
          lfs: false

      # Cheap, no-build gate that runs before the ~30-minute Rust job: the
      # particle system's look is selected by an integer shared between
      # `ParticleMode` (Rust) and a `switch` in particle-vert.glsl, and a
      # mismatch renders as generic white motes with no error anywhere. The
      # authoritative check is `shader_modes_match_particle_modes` in
      # voxygen/src/render/pipelines/particle.rs, but CI runs clippy + fmt,
      # not `cargo test`, so this dependency-free equivalent is what actually
      # guards the invariant here. ~1 second.
      - name: Particle mode / shader agreement
        run: python3 tools/particles/particle_modes.py --quiet

      - name: Install system dependencies
        # `mold` — the repo's .cargo/config.toml forces `-fuse-ld=mold` globally,
        # so the linker MUST be present or every build fails with "cannot find ld".
        # alsa/udev dev headers — voxygen (clippy'd by code-quality.sh) needs them to
        # compile. binutils/pkg-config — general build. No X11/wayland headers needed
        # for a compile-only (clippy) build — winit/wgpu dlopen those at runtime.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            mold binutils pkg-config libasound2-dev libudev-dev

      # The authc dependency lives in a private repository, so the runner needs
      # a credential to fetch it. AUTH_REPO_SSH_KEY is a deploy key with
      # read-only access to Matute289/xindeler-auth.
      - name: Authorize access to the private auth dependency
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUTH_REPO_SSH_KEY }}

      - name: Install Rust toolchain (pinned, read from rust-toolchain)
        # Read the pin dynamically so this stays in sync with the monthly bump
        # (unlike publish-docker.yml which hardcodes an old nightly).
        run: |
          TOOLCHAIN="$(cat rust-toolchain)"
          echo "Pinned toolchain: $TOOLCHAIN"
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --component rustfmt
          rustup default "$TOOLCHAIN"
          rustc --version && cargo clippy --version && cargo fmt --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: code-quality

      - name: Clippy (×3 feature sets) + rustfmt --check
        run: bash .github/scripts/code-quality.sh

      # Two families of unit test that guard a per-species value and that
      # clippy structurally cannot see:
      #
      #  - the `attr_fallback!` fall-through audits, which are a no-op outside
      #    `cfg(test)`;
      #  - `comp::body::stats`, which asserts `assets/common/body_stats.ron`
      #    loads and is sane. A species missing from that file is a panic at
      #    game start-up, so it has to fail here instead.
      #
      # Without this step both would be opt-in local tooling and a new species
      # that forgets a `mass`/`threat_tier`/`scaler` value would merge exactly
      # as silently as before.
      #
      # Deliberately filtered rather than running each crate's whole suite:
      # this checkout has no LFS, so `.vox`/`.ogg` assets are pointer files and
      # the asset-loading tests (e.g.
      # `terrain::structure::tests::test_structure_manifests`) would fail on
      # content that is fine. The two filters below read one text asset
      # (`body_stats.ron`), which is a real file here — RON is never
      # LFS-tracked.
      - name: Satisfy the asset-loader canary (this checkout has no LFS)
        # `assets/common/canary.canary` is LFS-tracked precisely so that a
        # player with a broken LFS setup gets a clear error instead of a
        # mysterious one; `common/assets` panics on start-up when its contents
        # are not the magic string. Here LFS is missing *on purpose* and the
        # file is a pointer, which would abort the tests below before they
        # load anything. The checkout is disposable, so satisfy the trip-wire
        # rather than dragging ~GB of binaries off the VPS into a lint job.
        run: printf 'VELOREN_CANARY_MAGIC\n' > assets/common/canary.canary

      - name: Attribute fall-through audits + body stats table (common + anim)
        run: |
          time cargo test --locked -p xindeler-common -p xindeler-anim --lib attr_audit
          time cargo test --locked -p xindeler-common --lib comp::body::stats
