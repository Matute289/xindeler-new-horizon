[net]
# The authc dependency lives in a private repository. libgit2, which cargo uses
# by default, cannot use an ssh-agent identity reliably, so delegate fetching to
# the git CLI — that picks up whatever credentials the developer or CI already
# has configured.
git-fetch-with-cli = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
# NH-58 [Q3]=A: native build on an ARM runner (ubuntu-24.04-arm), not
# cross-compiled from x86_64 — being able to actually execute the result
# for a real smoke test outweighs cross-compiling blind. A hardcoded
# `linker = "aarch64-linux-gnu-gcc"` here would break that: on a native ARM
# host the toolchain's own `cc` is already the right compiler, and
# `aarch64-linux-gnu-gcc` (the cross-prefixed name) doesn't exist there.
# Cross-compiling this target from x86_64 is no longer supported by this
# config — pass `-C linker=aarch64-linux-gnu-gcc` via RUSTFLAGS explicitly
# if that's ever needed again.
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-gnu]
rustflags = [
    # Required for mimalloc
    "-C",
    "link-arg=-lpsapi",
]

# Clever way to get workspace dir, from https://github.com/rust-lang/cargo/issues/3946#issuecomment-973132993
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[alias]
# tools
cmd-doc-gen = "run --features=bin_cmd_doc_gen --bin cmd_doc_gen"
csv-export = "run --manifest-path common/Cargo.toml --features=bin_csv --bin csv_export"
csv-import = "run --manifest-path common/Cargo.toml --features=bin_csv --bin csv_import"
find_unused = "run --manifest-path common/Cargo.toml --bin find_unused"
dot-recipes = "run --manifest-path common/Cargo.toml --features=bin_graphviz --bin recipe_graphviz"
dot-skills = "run --manifest-path common/Cargo.toml --features=bin_graphviz --bin skill_graphviz"
img-export = "run --manifest-path voxygen/Cargo.toml --features=bin_img-export --bin img-export"
# server-cli
server = "run --bin xindeler-server-cli"
test-server = "run --bin xindeler-server-cli --no-default-features --features simd"
tracy-server = "run --bin xindeler-server-cli --features tracy,simd --profile no_overflow"
tracy-server-debuginfo = "run --bin xindeler-server-cli --features tracy,simd --profile no_overflow_debuginfo"
tracy-server-releasedebuginfo = "run --bin xindeler-server-cli --features tracy,simd --profile releasedebuginfo"
tracy-test-server = "run --bin xindeler-server-cli --no-default-features --features tracy,simd --profile no_overflow"
# voxygen
test-voxygen = "run --bin xindeler-voxygen --no-default-features --features simd,egui-ui,shaderc-from-source,hot-reloading"
tracy-voxygen = "run --bin xindeler-voxygen --no-default-features --features tracy,simd,egui-ui,shaderc-from-source --profile no_overflow"
dbg-voxygen = "run --bin xindeler-voxygen --profile debuginfo"
# misc
swarm = "run --bin swarm --features client/bin_bot,client/tick_network --"
ci-clippy = "clippy --all-targets --locked --features=bin_cmd_doc_gen,bin_compression,bin_csv,bin_graphviz,bin_bot,bin_asset_migrate,bin,stat"
ci-clippy2 = "clippy -p xindeler-voxygen --locked --no-default-features --features=default-publish"
