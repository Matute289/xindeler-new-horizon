[package]
name = "xindeler-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
simd = ["vek/platform_intrinsics"]
plugins = ["common-state/plugins"]
bin_bot = [
    "serde",
    "ron",
    "clap",
    "rustyline",
    "common-frontend",
    "async-channel",
    "voxygen-i18n-helpers",
    "client-i18n",
]
tracy = ["common-base/tracy"]
tick_network = []

default = ["simd"]

[dependencies]
common = { package = "xindeler-common", path = "../common", features = [
    "no-assets",
] }
common-base = { package = "xindeler-common-base", path = "../common/base" }
common-state = { package = "xindeler-common-state", path = "../common/state", default-features = false }
common-systems = { package = "xindeler-common-systems", path = "../common/systems", default-features = false }
common-net = { package = "xindeler-common-net", path = "../common/net" }
network = { package = "xindeler-network", path = "../network", features = [
    "compression",
    "quic",
], default-features = false }

byteorder = "1.3.2"
tokio = { workspace = true, features = ["rt-multi-thread"] }
quinn = { workspace = true, features = ["rustls"] }
rustls = { workspace = true }
hickory-resolver = { version = "0.26.1", features = [
    "system-config",
    "tokio",
] }
image = { workspace = true }
num = { workspace = true }
tracing = { workspace = true }
rayon = { workspace = true }
specs = { workspace = true, features = [
    "serde",
    "storage-event-control",
    "derive",
] }
vek = { workspace = true }
hashbrown = { workspace = true }
# Private repository. See the note in README.md before cloning.
authc = { package = "xindeler-authc", git = "ssh://git@github.com/Matute289/xindeler-auth.git", branch = "main" }

#TODO: put bot in a different crate
#bot only
async-channel = { version = "2.1", optional = true }
voxygen-i18n-helpers = { package = "xindeler-i18n-helpers", path = "../voxygen/i18n-helpers", optional = true }
client-i18n = { package = "xindeler-client-i18n", path = "i18n", optional = true }
common-i18n = { package = "xindeler-common-i18n", path = "../common/i18n"}
serde = { workspace = true, features = ["rc"], optional = true }
ron = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
rustyline = { version = "18", optional = true }
## logging
common-frontend = { package = "xindeler-common-frontend", path = "../common/frontend", optional = true }

[dev-dependencies]
voxygen-i18n-helpers = { package = "xindeler-i18n-helpers", path = "../voxygen/i18n-helpers" }
client-i18n = { package = "xindeler-client-i18n", path = "i18n" }

[[example]]
name = "chat_cli"
required-features = ["bin_bot"]

[[bin]]
name = "bot"
required-features = ["bin_bot"]

[[bin]]
name = "swarm"
required-features = ["bin_bot", "tick_network"]

[[bin]]
name = "test_harness"
required-features = ["bin_bot", "tick_network"]
